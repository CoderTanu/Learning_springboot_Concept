<!DOCTYPE html>
<html lang="en">
<head>
    <title>XSS Demo</title>
</head>
<body>
<h2>Leave a Comment</h2>
<form  action="/comment" method="post">
	<input type ="text" name="comment" required>
	<button type="submit">Submit</button>	
</form>

<h3>Comments:</h3>
<ul>
	<li th:utext="${comment}" th:each="comment : ${comments}"></li>
</ul>

</body>
</html>
